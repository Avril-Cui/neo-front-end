<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO - Add Task</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1C1C1C 0%, #2A2A2A 100%);
            min-height: 100vh;
            color: #F5E8D8;
            line-height: 1.5;
            padding: 20px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-container {
            background: linear-gradient(135deg, #2A2A2A 0%, #333 100%);
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
            position: relative;
        }

        .modal-header {
            padding: 24px 24px 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: #F5E8D8;
        }

        .close-button {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(245, 232, 216, 0.1);
            color: #F5E8D8;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 18px;
        }

        .close-button:hover {
            background: rgba(245, 232, 216, 0.2);
            transform: scale(1.1);
        }

        .modal-content {
            padding: 0 24px 24px 24px;
        }

        .form-section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #F5E8D8;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .field-group {
            display: grid;
            gap: 20px;
            margin-bottom: 20px;
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .field-full {
            grid-column: 1 / -1;
        }

        .input-field {
            position: relative;
        }

        .input-label {
            font-size: 12px;
            font-weight: 600;
            color: #AAA;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: block;
        }

        .input-wrapper {
            position: relative;
        }

        .task-input {
            width: 100%;
            padding: 16px 20px 16px 52px;
            background: transparent;
            border: 2px solid rgba(121, 158, 255, 0.3);
            border-radius: 12px;
            color: #F5E8D8;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            outline: none;
        }

        .task-input:focus {
            border-color: #799EFF;
            box-shadow: 0 0 0 4px rgba(121, 158, 255, 0.1);
        }

        .task-input.error {
            border-color: #FF6F61;
            box-shadow: 0 0 0 4px rgba(255, 111, 97, 0.1);
        }

        .task-input::placeholder {
            color: #666;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #799EFF;
        }

        .error-message {
            font-size: 12px;
            color: #FF6F61;
            margin-top: 6px;
            display: none;
        }

        .task-input.error + .error-message {
            display: block;
        }

        .select-field {
            position: relative;
        }

        .custom-select {
            width: 100%;
            padding: 16px 20px;
            background: transparent;
            border: 2px solid rgba(245, 232, 216, 0.2);
            border-radius: 12px;
            color: #F5E8D8;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .custom-select:focus-within {
            border-color: #FF6F61;
        }

        .select-icon {
            font-size: 14px;
            transition: transform 0.2s ease;
        }

        .custom-select.open .select-icon {
            transform: rotate(180deg);
        }

        .select-options {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(42, 42, 42, 0.95);
            border: 1px solid #444;
            border-radius: 12px;
            backdrop-filter: blur(20px);
            z-index: 10;
            margin-top: 4px;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .select-option {
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(68, 68, 68, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .select-option:last-child {
            border-bottom: none;
        }

        .select-option:hover {
            background: rgba(121, 158, 255, 0.1);
        }

        .duration-field {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: end;
        }

        .duration-input {
            display: flex;
            align-items: center;
            background: transparent;
            border: 2px solid rgba(245, 232, 216, 0.2);
            border-radius: 12px;
            padding: 16px 20px;
            gap: 12px;
        }

        .duration-input:focus-within {
            border-color: #FF6F61;
        }

        .duration-value {
            font-size: 20px;
            font-weight: 700;
            color: #F5E8D8;
            background: transparent;
            border: none;
            outline: none;
            width: 60px;
            text-align: center;
        }

        .duration-unit {
            font-size: 14px;
            color: #AAA;
        }

        .duration-controls {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .duration-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(121, 158, 255, 0.2);
            color: #799EFF;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .duration-btn:hover {
            background: rgba(121, 158, 255, 0.3);
        }

        .priority-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .priority-option {
            padding: 16px;
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-weight: 600;
        }

        .priority-option.low {
            background: rgba(76, 175, 80, 0.1);
            color: #4CAF50;
        }

        .priority-option.medium {
            background: rgba(218, 165, 32, 0.1);
            color: #DAA520;
        }

        .priority-option.high {
            background: rgba(255, 111, 97, 0.1);
            color: #FF6F61;
        }

        .priority-option.selected {
            border-color: currentColor;
        }

        .toggle-field {
            display: flex;
            align-items: center;
            gap: 12px;
            background: transparent;
            border: 2px solid rgba(245, 232, 216, 0.2);
            border-radius: 12px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-field.active {
            border-color: #799EFF;
            background: rgba(121, 158, 255, 0.1);
        }

        .toggle-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #799EFF;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            transition: all 0.2s ease;
        }

        .toggle-field.active .toggle-checkbox {
            background: #799EFF;
            color: #1C1C1C;
        }

        .toggle-label {
            font-size: 16px;
            font-weight: 500;
            color: #F5E8D8;
        }

        .advanced-settings {
            margin-top: 32px;
        }

        .advanced-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            cursor: pointer;
            border-bottom: 1px solid rgba(245, 232, 216, 0.1);
            margin-bottom: 20px;
        }

        .advanced-toggle:hover {
            background: rgba(245, 232, 216, 0.02);
        }

        .advanced-icon {
            font-size: 16px;
            color: #799EFF;
            transition: transform 0.3s ease;
        }

        .advanced-settings.open .advanced-icon {
            transform: rotate(180deg);
        }

        .advanced-content {
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .advanced-settings.open .advanced-content {
            max-height: 1000px;
        }

        .datetime-input {
            width: 100%;
            padding: 16px 20px;
            background: transparent;
            border: 2px solid rgba(245, 232, 216, 0.2);
            border-radius: 12px;
            color: #F5E8D8;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .datetime-input:focus {
            border-color: #FF6F61;
        }

        .dependency-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
            min-height: 40px;
            padding: 12px;
            background: rgba(245, 232, 216, 0.02);
            border: 1px solid rgba(245, 232, 216, 0.1);
            border-radius: 8px;
        }

        .dependency-tag {
            background: rgba(121, 158, 255, 0.2);
            color: #799EFF;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .remove-tag {
            cursor: pointer;
            font-size: 14px;
            opacity: 0.7;
        }

        .remove-tag:hover {
            opacity: 1;
        }

        .textarea-field {
            width: 100%;
            min-height: 100px;
            padding: 16px 20px;
            background: transparent;
            border: 2px solid rgba(245, 232, 216, 0.2);
            border-radius: 12px;
            color: #F5E8D8;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            transition: all 0.3s ease;
            outline: none;
            font-family: inherit;
        }

        .textarea-field:focus {
            border-color: #FF6F61;
        }

        .textarea-field::placeholder {
            color: #666;
        }

        .action-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(245, 232, 216, 0.1);
        }

        .secondary-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary {
            background: transparent;
            color: #AAA;
            border: 1px solid rgba(245, 232, 216, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(245, 232, 216, 0.05);
            color: #F5E8D8;
        }

        .btn-primary {
            background: linear-gradient(135deg, #799EFF 0%, #6B8FFF 100%);
            color: #1C1C1C;
            font-weight: 700;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #6B8FFF 0%, #5B7FFF 100%);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background: #444;
            color: #666;
            cursor: not-allowed;
            transform: none;
        }

        .add-dependency-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 2px dashed rgba(245, 232, 216, 0.3);
            border-radius: 8px;
            color: #AAA;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .add-dependency-btn:hover {
            border-color: rgba(121, 158, 255, 0.5);
            color: #799EFF;
        }
    </style>
</head>
<body>
    <div class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h1 class="modal-title">Add New Task</h1>
                <button class="close-button" onclick="closeModal()">×</button>
            </div>

            <div class="modal-content">
                <form id="taskForm">
                    <!-- Basic Information -->
                    <div class="form-section">
                        <div class="section-title">📋 Basic Information</div>

                        <div class="field-group">
                            <div class="input-field field-full">
                                <label class="input-label">Task Name *</label>
                                <div class="input-wrapper">
                                    <div class="input-icon">😊</div>
                                    <input type="text" class="task-input" id="taskName" placeholder="Task name..." required>
                                    <div class="error-message">Task name is required</div>
                                </div>
                            </div>

                            <div class="field-row">
                                <div class="select-field">
                                    <label class="input-label">Category</label>
                                    <div class="custom-select" onclick="toggleDropdown('categorySelect')">
                                        <span id="categoryValue">Work</span>
                                        <span class="select-icon">▼</span>
                                    </div>
                                    <div class="select-options" id="categorySelect">
                                        <div class="select-option" onclick="selectCategory('Work', '💼')">
                                            <span>💼</span> Work
                                        </div>
                                        <div class="select-option" onclick="selectCategory('Personal', '👤')">
                                            <span>👤</span> Personal
                                        </div>
                                        <div class="select-option" onclick="selectCategory('Health & Fitness', '🏃')">
                                            <span>🏃</span> Health & Fitness
                                        </div>
                                        <div class="select-option" onclick="selectCategory('Education', '📚')">
                                            <span>📚</span> Education
                                        </div>
                                        <div class="select-option" onclick="selectCategory('Creative', '🎨')">
                                            <span>🎨</span> Creative
                                        </div>
                                    </div>
                                </div>

                                <div class="duration-field">
                                    <div>
                                        <label class="input-label">Duration</label>
                                        <div class="duration-input">
                                            <input type="number" class="duration-value" id="durationValue" value="1" min="0.25" max="8" step="0.25">
                                            <span class="duration-unit">hr</span>
                                        </div>
                                    </div>
                                    <div class="duration-controls">
                                        <button type="button" class="duration-btn" onclick="adjustDuration(0.25)">+</button>
                                        <button type="button" class="duration-btn" onclick="adjustDuration(-0.25)">−</button>
                                    </div>
                                </div>
                            </div>

                            <div class="field-row">
                                <div>
                                    <label class="input-label">Priority</label>
                                    <div class="priority-selector">
                                        <div class="priority-option low" onclick="selectPriority(1, this)">
                                            Low
                                        </div>
                                        <div class="priority-option medium selected" onclick="selectPriority(2, this)">
                                            Medium
                                        </div>
                                        <div class="priority-option high" onclick="selectPriority(3, this)">
                                            High
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <label class="input-label">Split Task</label>
                                    <div class="toggle-field" id="splitToggle" onclick="toggleSplit()">
                                        <div class="toggle-checkbox">✓</div>
                                        <span class="toggle-label">Allow splitting</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Advanced Settings -->
                    <div class="advanced-settings" id="advancedSettings">
                        <div class="advanced-toggle" onclick="toggleAdvanced()">
                            <div class="section-title">⚙️ Advanced Settings</div>
                            <span class="advanced-icon">▼</span>
                        </div>

                        <div class="advanced-content">
                            <div class="field-group">
                                <div class="field-row">
                                    <div class="input-field">
                                        <label class="input-label">Deadline (Optional)</label>
                                        <input type="datetime-local" class="datetime-input" id="deadline">
                                    </div>

                                    <div class="input-field">
                                        <label class="input-label">Buffer Time (Optional)</label>
                                        <div class="duration-input">
                                            <input type="number" class="duration-value" id="slackValue" value="0" min="0" max="4" step="0.25" placeholder="0">
                                            <span class="duration-unit">hr</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="input-field field-full">
                                    <label class="input-label">Prerequisites (Optional)</label>
                                    <div class="dependency-list" id="preDependencies">
                                        <!-- Dependencies will be added here -->
                                    </div>
                                    <button type="button" class="add-dependency-btn" onclick="addDependency('pre')">
                                        + Add prerequisite task
                                    </button>
                                </div>

                                <div class="input-field field-full">
                                    <label class="input-label">Dependent Tasks (Optional)</label>
                                    <div class="dependency-list" id="postDependencies">
                                        <!-- Dependencies will be added here -->
                                    </div>
                                    <button type="button" class="add-dependency-btn" onclick="addDependency('post')">
                                        + Add dependent task
                                    </button>
                                </div>

                                <div class="input-field field-full">
                                    <label class="input-label">Notes (Optional)</label>
                                    <textarea class="textarea-field" id="notes" placeholder="Add notes here... markdown supported"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="action-buttons">
                        <div class="secondary-actions">
                            <button type="button" class="btn btn-secondary" onclick="saveDraft()">
                                📄 Save Draft
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="scheduleAfter()">
                                ↩️ Schedule After
                            </button>
                        </div>
                        <button type="submit" class="btn btn-primary" id="createBtn">
                            Create Task
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let selectedCategory = 'Work';
        let selectedPriority = 2;
        let isSplittable = true;
        let preDeps = [];
        let postDeps = [];

        function closeModal() {
            // Close modal logic
            console.log('Closing modal...');
        }

        function toggleDropdown(id) {
            const dropdown = document.getElementById(id);
            const select = dropdown.previousElementSibling;

            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
            select.classList.toggle('open');
        }

        function selectCategory(category, icon) {
            selectedCategory = category;
            document.getElementById('categoryValue').innerHTML = `${icon} ${category}`;
            toggleDropdown('categorySelect');
        }

        function adjustDuration(change) {
            const input = document.getElementById('durationValue');
            let newValue = parseFloat(input.value) + change;
            if (newValue >= 0.25 && newValue <= 8) {
                input.value = newValue;
            }
        }

        function selectPriority(priority, element) {
            selectedPriority = priority;
            document.querySelectorAll('.priority-option').forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
        }

        function toggleSplit() {
            const toggle = document.getElementById('splitToggle');
            toggle.classList.toggle('active');
            isSplittable = toggle.classList.contains('active');
        }

        function toggleAdvanced() {
            const settings = document.getElementById('advancedSettings');
            settings.classList.toggle('open');
        }

        function addDependency(type) {
            const taskName = prompt(`Enter ${type === 'pre' ? 'prerequisite' : 'dependent'} task name:`);
            if (taskName && taskName.trim()) {
                const container = document.getElementById(type === 'pre' ? 'preDependencies' : 'postDependencies');
                const tag = document.createElement('div');
                tag.className = 'dependency-tag';
                tag.innerHTML = `
                    ${taskName.trim()}
                    <span class="remove-tag" onclick="removeDependency(this, '${type}', '${taskName.trim()}')">&times;</span>
                `;
                container.appendChild(tag);

                if (type === 'pre') {
                    preDeps.push(taskName.trim());
                } else {
                    postDeps.push(taskName.trim());
                }
            }
        }

        function removeDependency(element, type, taskName) {
            element.parentElement.remove();
            if (type === 'pre') {
                preDeps = preDeps.filter(dep => dep !== taskName);
            } else {
                postDeps = postDeps.filter(dep => dep !== taskName);
            }
        }

        function saveDraft() {
            console.log('Saving draft...');
            // Save draft logic
        }

        function scheduleAfter() {
            console.log('Schedule after current task...');
            // Schedule after logic
        }

        // Form validation
        document.getElementById('taskForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const taskName = document.getElementById('taskName').value.trim();
            const createBtn = document.getElementById('createBtn');

            if (!taskName) {
                document.getElementById('taskName').classList.add('error');
                return;
            }

            document.getElementById('taskName').classList.remove('error');

            // Collect form data
            const formData = {
                taskName: taskName,
                category: selectedCategory,
                duration: parseFloat(document.getElementById('durationValue').value),
                priority: selectedPriority,
                splittable: isSplittable,
                deadline: document.getElementById('deadline').value || null,
                slack: parseFloat(document.getElementById('slackValue').value) || 0,
                preDependencies: preDeps,
                postDependencies: postDeps,
                notes: document.getElementById('notes').value.trim() || null
            };

            console.log('Creating task:', formData);

            // Simulate API call
            createBtn.disabled = true;
            createBtn.innerHTML = 'Creating...';

            setTimeout(() => {
                createBtn.disabled = false;
                createBtn.innerHTML = 'Create Task';
                alert('Task created successfully!');
                closeModal();
            }, 1500);
        });

        // Close dropdowns when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.custom-select')) {
                document.querySelectorAll('.select-options').forEach(dropdown => {
                    dropdown.style.display = 'none';
                });
                document.querySelectorAll('.custom-select').forEach(select => {
                    select.classList.remove('open');
                });
            }
        });

        // Real-time validation
        document.getElementById('taskName').addEventListener('input', function() {
            if (this.value.trim()) {
                this.classList.remove('error');
            }
        });
    </script>
</body>
</html>
